name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH directory and key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known_hosts
        run: |
          touch ~/.ssh/known_hosts
          PROD_PORT="${{ secrets.PROD_SSH_PORT }}"
          if [ -z "$PROD_PORT" ]; then
            ssh-keyscan -t rsa "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PROD_PORT" -t rsa "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Create SSH config
        run: |
          PROD_PORT="${{ secrets.PROD_SSH_PORT }}"
          PORT_LINE=""
          if [ -n "$PROD_PORT" ]; then
            PORT_LINE="Port $PROD_PORT"
          fi

          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.PROD_HOST }}
            User ${{ secrets.PROD_USER }}
            IdentityFile ~/.ssh/id_rsa
            ${PORT_LINE}
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ForwardAgent no
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Debug SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -vvv prod "echo 'Connection successful'"

      - name: Deploy
        run: |
          ssh prod "cd ${{ secrets.PROD_PATH }}/scripts && ./deploy_docker.sh"
