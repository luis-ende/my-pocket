name: Deploy to Production

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH directory and key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known_hosts (verify fingerprint)
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }} # optional, default 22
        run: |
          touch ~/.ssh/known_hosts
          if [ -z "${PROD_PORT}" ]; then
            ssh-keyscan -t rsa ${PROD_HOST} >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${PROD_PORT} -t rsa ${PROD_HOST} >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Create SSH config
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          cat > ~/.ssh/config <<'EOF'
          Host prod
            HostName ${PROD_HOST}
            User ${PROD_USER}
            IdentityFile ~/.ssh/id_rsa
            Port 22
            ForwardAgent no
            ServerAliveInterval 60
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy
        run: |
          ssh prod "cd ${{ secrets.PROD_PATH }}/scripts && ./deploy_docker.sh"
