name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH directory and key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy-helper-vps.key
          chmod 600 ~/.ssh/deploy-helper-vps.key

      - name: Verify SSH key
        run: |
          echo "First line of key:"
          head -n 1 ~/.ssh/deploy-helper-vps.key
          echo "Last line of key:"
          tail -n 1 ~/.ssh/deploy-helper-vps.key
          echo "Key fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy-helper-vps.key || echo "ERROR: Invalid key format!"

      - name: Add server to known_hosts
        run: |
          touch ~/.ssh/known_hosts
          PROD_PORT="${{ secrets.PROD_SSH_PORT }}"
          if [ -z "$PROD_PORT" ]; then
            ssh-keyscan -t rsa "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PROD_PORT" -t rsa "${{ secrets.PROD_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Create SSH config
        run: |
          PROD_PORT="${{ secrets.PROD_SSH_PORT }}"
          PORT_LINE=""
          if [ -n "$PROD_PORT" ]; then
            PORT_LINE="Port $PROD_PORT"
          fi

          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.PROD_HOST }}
            User ${{ secrets.PROD_USER }}
            Port ${{ secrets.PROD_PORT }}
            IdentityFile ~/.ssh/deploy-helper-vps.key
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Debug SSH connection
        run: |
          echo "Testing SSH connection..."
          ssh -vvv prod "echo 'Connection successful'"

      - name: Deploy
        run: |
          ssh prod "bash -lc 'cd ${{ secrets.PROD_PATH }}/scripts && ./deploy_docker.sh'"
